[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citeguard-free"
version = "2.0.0"
description = "Free, open-source deep citation verification and validation CLI + web GUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Md Rashedul Hasan"}]
dependencies = [
  "requests>=2.31",
  "rapidfuzz>=3.9",
  "typer>=0.12",
  "rich>=13.7",
  "streamlit>=1.37",
  "pandas>=2.0",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "reportlab>=4.2",
]

[project.scripts]
citeguard = "citeguard.cli:app"

[tool.setuptools.packages.find]
include = ["citeguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
