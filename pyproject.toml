[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citeguard"
version = "3.0.0"
description = "Research-integrity citation verification platform with CLI and SaaS web application"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Md Rashedul Hasan"}]
dependencies = [
  "requests>=2.31",
  "rapidfuzz>=3.9",
  "typer>=0.12",
  "rich>=13.7",
  "streamlit>=1.37",
  "pandas>=2.0",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.scripts]
citeguard = "citeguard.cli:app"

[tool.setuptools.packages.find]
include = ["citeguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
